[project]
name = "evbot"
version = "0.1.0"
description = "Week 3 lab — an EV Q&A agent: guardrails, judge, router, memory, RAG, Gradio, uv"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "chromadb>=0.5.0",
    "gradio>=5.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
